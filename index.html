<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Catat Sate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <div class="header-time" id="clockDisplay">Memuat waktu...</div>

    <div class="card">
    <input type="text" id="nameInput" class="name-input" placeholder="Nama Pemesan harus di isi" autocomplete="off">

    <div class="divider"></div>

    <span class="card-label">Berat Sate (Kg)</span>
    <input type="number" id="kgInput" class="kg-input" placeholder="0.0" step="0.1" inputmode="decimal">

    <div class="quick-grid">
        <button type="button" class="btn-quick" onclick="addKg(0.5)">+0.5</button>
        <button type="button" class="btn-quick" onclick="addKg(1.0)">+1</button>
        <button type="button" class="btn-quick" onclick="addKg(2.0)">+2</button>
        <button type="button" class="btn-quick" onclick="addKg(5.0)">+5</button>
        <button type="button" class="btn-quick" onclick="addKg(-0.5)">-0.5</button>
        <button type="button" class="btn-quick" onclick="addKg(-1.0)">-1</button>
        <button type="button" class="btn-quick" onclick="addKg(-2.0)">-2</button>
        <button type="button" class="btn-quick" onclick="addKg(-5.0)">-5</button>
    </div>
    </div>

    <div class="card">
    <span class="card-label">Jadwal Pengambilan</span>

    <div class="pickup-row">
        <div class="pickup-col">
        <label class="sub-label">Tanggal Ambil</label>
        <input type="date" id="pickupDateInput" class="date-picker">
        </div>
        <div class="pickup-col">
        <label class="sub-label">Waktu Ambil</label>
        <input type="time" id="pickupTimeInput" class="time-picker">
        </div>
    </div>

    <div class="quick-row">
        <button type="button" class="btn-chip" onclick="setPickupDateOffset(0)">Hari Ini</button>
        <button type="button" class="btn-chip" onclick="setPickupDateOffset(1)">Besok</button>
        <button type="button" class="btn-chip" onclick="addMinutesToPickup(-60)">-1j</button>
        <button type="button" class="btn-chip" onclick="addMinutesToPickup(60)">+1j</button>
    </div>
    </div>

    <button type="button" class="btn-save" onclick="handleSave()">Simpan Pesanan</button>

    <div class="summary-grid">
    <div class="summary-card">
        <span class="summary-label">Belum Diambil Hari Ini</span>
        <span class="summary-value" id="todayPickupTotal">0.0 kg</span>
    </div>
    <div class="summary-card summary-secondary">
        <span class="summary-label">Total Hari Ini</span>
        <span class="summary-value" id="todayOrderTotal">0.0 kg</span>
    </div>
    </div>

    <div class="filter-tabs">
    <button type="button" id="tabToday" class="tab-btn active" onclick="setFilter('today')">
        Ambil Hari Ini <span class="tab-badge" id="badgeToday">0</span>
    </button>
    <button type="button" id="tabAll" class="tab-btn" onclick="setFilter('all')">
        Semua Pesanan <span class="tab-badge" id="badgeAll">0</span>
    </button>
    </div>

    <div class="list-title">Tap Bulatan untuk Selesai • Geser Kiri untuk Hapus</div>
    <div class="order-list" id="orderList"></div>
</div>

<script src="app.js"></script>
</body>
</html>
